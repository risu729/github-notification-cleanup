# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise-task.json

[check]
depends = ["worker:generate-types"]
usage = '''
flag "--lint" help="Run hk check instead of fix"
'''
run = """
hk \
  {% if usage.lint %}check{% else %}fix{% endif %} \
  --all --no-progress --no-fail-fast
"""
description = "Run hk linters and formatters."

[test]
depends = ["worker:generate-types"]
env = { GH_TOKEN = "test" }
run = "bun run vitest run"
description = "Run unit tests."

["worker:generate-types"]
run = "bun run wrangler types worker-configuration.d.ts"
hide = true
description = "Generate Cloudflare Worker runtime and binding types."

["worker:migrate"]
env = { CLOUDFLARE_ACCOUNT_ID = { required = "Set the Cloudflare account ID" }, CLOUDFLARE_API_TOKEN = { required = "Set a Cloudflare Workers API token" } }
run = "bun run wrangler d1 migrations apply github-notification-cleanup --remote"
description = "Apply pending migrations to the production D1 database."
