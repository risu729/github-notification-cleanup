name: Worker Deploy
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/worker-deploy.yml"
      - "bun.lock"
      - "migrations/**"
      - "mise.toml"
      - "package.json"
      - "src/**"
      - "tasks.toml"
      - "wrangler.jsonc"
  workflow_dispatch:
concurrency:
  group: worker-production
  cancel-in-progress: false
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # for checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.15
      - name: Install dependencies
        run: mise deps
      - name: Provision Queues
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: mise run worker:provision
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: mise run worker:migrate
      - name: Deploy Worker
        uses: risu729/wrangler-deploy-action@e943f9681fb250fa0d0a104bd95ea121c510d192 # v1.2.0
        with:
          mode: production
          config: wrangler.jsonc
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          secrets-json: >-
            {"GH_TOKEN":${{ toJSON(secrets.RENOVATE_NOTIFICATIONS_TOKEN) }}}
