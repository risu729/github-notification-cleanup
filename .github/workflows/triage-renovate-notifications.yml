name: Triage Renovate Notifications
on:
  schedule:
    - cron: "7/10 * * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  triage:
    name: Mark Auto-Merge Notifications Done
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # for checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.0
        env:
          MISE_ENABLE_TOOLS: bun
      - name: Mark Auto-Merge Renovate Notifications Done
        env:
          GH_TOKEN: ${{ secrets.RENOVATE_NOTIFICATIONS_TOKEN }}
        run: bun run src/triage-renovate-notifications.ts
