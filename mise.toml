# ref: https://mise.jdx.dev/configuration.html
#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2026.10.9"

[tools]
node = "26.11.1"
bun = "1.4.3"
hk = "2.6.0"
oxlint = "1.77.0"
oxfmt = "0.72.0"
"npm:typescript" = "7.0.2"
jactionlint = "2.1.0"
ghalint = "1.5.6"
pinact = "5.0.0"
zizmor = "1.30.1"
shellcheck = "0.11.0"
rumdl = "v0.2.79"
yamlfmt = "0.21.0"
uv = "0.13.1"
yamllint = "1.38.0"
betterleaks = "v1.9.0"

[settings]
lockfile = true
lockfile_mode = "generate"
lockfile_platforms = ["linux-x64", "macos-arm64"]
experimental = true

[settings.npm]
package_manager = "bun"

[deps.bun]
auto = true
run = "bun install --frozen-lockfile"

[task_config]
includes = ["tasks.toml", "tasks"]
