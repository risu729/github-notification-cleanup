# ref: https://mise.jdx.dev/configuration.html
#:schema https://mise.jdx.dev/schema/mise.json

[tools]
bun = "1.3.14"
hk = "1.54.0"
oxlint = "1.77.0"
oxfmt = "0.62.0"
"npm:typescript" = "7.0.2"
actionlint = "1.7.12"
ghalint = "1.5.6"
pinact = "4.1.1"
zizmor = "1.29.0"
shellcheck = "0.11.0"
rumdl = "v0.2.49"
yamlfmt = "0.21.0"
yamllint = "1.38.0"
betterleaks = "v1.7.3"

[settings]
experimental = true

[settings.npm]
package_manager = "bun"

[deps.bun]
auto = true
sources = ["package.json", "bun.lock"]
outputs = ["node_modules"]
run = "bun install --frozen-lockfile"

[task_config]
includes = ["tasks.toml", "tasks"]
