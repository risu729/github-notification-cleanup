# ref: https://mise.jdx.dev/configuration.html
#:schema https://mise.jdx.dev/schema/mise.json

[tools]
hk = "1.54.0"
actionlint = "1.7.12"
ghalint = "1.5.6"
pinact = "4.1.1"
zizmor = "1.29.0"
shellcheck = "0.11.0"
rumdl = "v0.2.49"
yamlfmt = "0.21.0"
yamllint = "1.38.0"
betterleaks = "v1.7.3"

[tasks.check]
usage = '''
flag "--lint" help="Run hk check instead of fix"
'''
run = """
hk \
  {% if usage.lint %}check{% else %}fix{% endif %} \
  --all --no-progress --no-fail-fast
"""
description = "Run hk linters and formatters."
