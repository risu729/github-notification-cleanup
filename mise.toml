# ref: https://mise.jdx.dev/configuration.html
#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2026.10.9"

[tools]
node = "26.12.1"
bun = "1.4.4"
hk = "2.9.0"
oxlint = "1.77.0"
oxfmt = "0.74.0"
"npm:typescript" = "7.0.2"
jactionlint = "v2.3.0"
ghalint = "1.5.7"
pinact = "5.0.2"
zizmor = "1.31.1"
shellcheck = "0.11.0"
rumdl = "v0.3.0"
yamlfmt = "0.21.0"
uv = "0.13.6"
yamllint = "1.38.0"
betterleaks = "v1.9.0"

[settings]
lockfile = true
lockfile_mode = "generate"
lockfile_platforms = ["linux-x64", "macos-arm64"]
experimental = true

[settings.npm]
package_manager = "bun"

[deps.bun]
auto = true
run = "bun install --frozen-lockfile"

[task_config]
includes = ["tasks.toml", "tasks"]
