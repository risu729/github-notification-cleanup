# ref: https://mise.jdx.dev/configuration.html
#:schema https://mise.jdx.dev/schema/mise.json

[tools]
bun = "1.4.0"
hk = "1.57.0"
oxlint = "1.77.0"
oxfmt = "0.65.0"
"npm:typescript" = "7.0.2"
actionlint = "1.7.12"
ghalint = "1.5.6"
pinact = "4.1.1"
zizmor = "1.30.0"
shellcheck = "0.11.0"
rumdl = "v0.2.63"
yamlfmt = "0.21.0"
yamllint = "1.38.0"
betterleaks = "v1.8.1"

[settings]
experimental = true

[settings.npm]
package_manager = "bun"

[deps.bun]
auto = true
run = "bun install --frozen-lockfile"

[task_config]
includes = ["tasks.toml", "tasks"]
