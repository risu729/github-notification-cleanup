# ref: https://mise.jdx.dev/configuration.html
#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2026.10.19"

[tools]
node = "26.13.1"
bun = "1.4.5"
hk = "2.14.0"
oxlint = "1.77.0"
oxfmt = "0.75.0"
"npm:typescript" = "7.0.2"
jactionlint = "v2.6.0"
ghalint = "1.6.0"
pinact = "5.0.2"
zizmor = "1.33.1"
shellcheck = "0.11.0"
rumdl = "v0.3.6"
yamlfmt = "0.21.0"
uv = "0.13.10"
yamllint = "1.38.0"
betterleaks = "v1.10.1"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"]
experimental = true

[settings.npm]
package_manager = "bun"

[deps.bun]
auto = true
run = "bun install --frozen-lockfile"

[task_config]
includes = ["tasks.toml", "tasks"]
